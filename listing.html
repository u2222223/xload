<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — xload</title>
  <meta name="description" content="Browse and search every browser userscript listed on xload. Filter by keyword and category, then install directly from GitHub.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://xload.net/listing.html">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Google AdSense consent + auto ads (replace ID below) -->

    window.xloadInit = window.xloadInit || [];

<body data-nav="script">

  <div id="chrome-header"></div>

  <main>
    <div class="container page">
      <nav class="crumb"><span>Home</span></nav>
      <div class="page-header">
        <h1>Home</h1>
        <p>Every userscript in the catalog. Use the search, filters and sort to find what you need. New tools are added regularly.</p>
      </div>

      <!-- Filters -->
      <div class="toolbar">
        <select id="ff-type" aria-label="Filter by type">
          <option value="all">All types</option>
        </select>
        <input class="f-search" id="filter-q" type="text" placeholder="Filter results by keyword&hellip;" aria-label="Keyword filter">
        <select id="ff-sort" aria-label="Sort order">
          <option value="popular">Most popular</option>
          <option value="newest">Newest</option>
          <option value="name">Name A&ndash;Z</option>
        </select>
      </div>

      <p class="count-line" id="count-line"></p>
      <div class="card-grid" id="listing"></div>
    </div>
  </main>

  <div id="chrome-footer"></div>

  <script src="/assets/js/main.js"></script>
