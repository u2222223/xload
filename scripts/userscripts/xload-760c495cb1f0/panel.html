    <header class="panel-header">

        <p class="panel-subtitle">客優雲庫存清單 功能</p>

    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待腳本連接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="params">
          <div class="pui-card-head">
            <div class="pui-card-title">參數設定</div>

            <div class="pui-card-desc">執行功能前可調整的查詢與寫入參數。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-warehouseId">倉庫 ID</label>
              <input class="pui-input" id="ctl-warehouseId" data-control="warehouseId" data-type="text" type="text" value="1454426052596420608">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-batchSize">每批筆數</label>
              <input class="pui-input" id="ctl-batchSize" data-control="batchSize" data-type="number" type="number" value="50">

            <div class="pui-field">
              <label class="pui-label" for="ctl-stockingDays">備貨天數</label>
              <input class="pui-input" id="ctl-stockingDays" data-control="stockingDays" data-type="number" type="number" value="3">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-skuCodeLength">SKU 編號長度</label>
              <input class="pui-input" id="ctl-skuCodeLength" data-control="skuCodeLength" data-type="number" type="number" value="10">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-pageDelay">分頁間隔（毫秒）</label>
              <input class="pui-input" id="ctl-pageDelay" data-control="pageDelay" data-type="number" type="number" value="5000">
            </div>


          </div>


        </section>

        <section class="pui-card panel-section" data-section="operations">

            <div class="pui-card-title">功能操作</div>

          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="autoUpdateSafe">自動更新安全庫存</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="openOverSell">打開防超賣</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="updateCargo">更新蝦皮庫存</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="deleteStock">刪除庫存清單</button>
