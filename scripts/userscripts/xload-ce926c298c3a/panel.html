<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegra.ph 图片打包下载 - 功能面板</title>
  <meta name="description" content="获取网页所有图片链接，保存到文本文件并一键下载到本地压缩包。">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-ce926c298c3a">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>Telegra.ph 图片打包下载</h1>
        <p class="panel-subtitle">获取网页所有图片链接，保存到文本文件并一键下载到本地压缩包。</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="collect">
          <div class="pui-card-head">
            <div class="pui-card-title">图片链接收集</div>

            <div class="pui-card-desc">收集当前页面中的全部图片链接，并同步到脚本侧文本框。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-dedupe">去除重复链接</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-dedupe" data-control="dedupe" data-type="switch"><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="collect">收集图片链接</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="copy">复制全部链接</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="download">
          <div class="pui-card-head">
            <div class="pui-card-title">打包下载</div>

            <div class="pui-card-desc">将图片连同链接清单打包为 ZIP 并保存到本地。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-zipName">压缩包名称（留空自动命名）</label>
              <input class="pui-input" id="ctl-zipName" data-control="zipName" data-type="text" type="text" value="">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-concurrency">并发下载数（0 为不限制）</label>
              <input class="pui-input" id="ctl-concurrency" data-control="concurrency" data-type="number" type="number" value="0">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="download">一键打包下载</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
