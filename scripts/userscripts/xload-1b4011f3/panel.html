<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="panel.documentTitle">Product price history tracker &amp; browsing insights for shopping sites - Panel</title>
  <meta name="description" content="Tracks product prices you view on supported stores and shows the price trend so you can decide when to buy.">
  <meta name="keywords" content="xload">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/panel/panel.css">
  <style>
    /* 功能面板业务布局补充：仅黑白灰，不重定义共享组件基础外观 */
    .ph-product { padding: 12px 0; border-bottom: 1px solid #ececec; }
    .ph-product:last-child { border-bottom: 0; }
    .ph-product-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .ph-title { font-size: 14px; line-height: 1.4; }
    .ph-store { display: inline-block; margin: 4px 0 6px; padding: 1px 8px; border: 1px solid #d4d4d4; border-radius: 4px; color: #555; font-size: 11px; }
    .ph-price-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: #555; }
    .ph-label { color: #888; margin-right: 4px; }
    .ph-value { color: #111; font-weight: 600; }
    .ph-drop-down { color: #111; font-weight: 600; }
    .ph-drop-up { color: #555; }
    .ph-meta { margin: 4px 0 6px; font-size: 12px; color: #888; }
    .ph-chart { margin-top: 6px; }
    .ph-group { margin-bottom: 14px; padding: 12px; border: 1px solid #ececec; border-radius: 4px; background: #fafafa; }
    .ph-group-title { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #111; }
    .ph-group-lbl { color: #888; font-weight: 400; font-size: 12px; }
    .ph-group li { font-size: 12px; }
    .ph-cheap { margin-left: 8px; padding: 0 6px; border: 1px solid #111; border-radius: 3px; color: #111; font-size: 11px; }
  </style>
</head>
<body>
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1 data-i18n="title">Product price history tracker &amp; browsing insights for shopping sites</h1>
        <p class="panel-subtitle" data-i18n="short">Tracks product prices you view on supported stores and shows the price trend so you can decide when to buy.</p>
      </div>
    </header>

    <main class="panel-main">
      <!-- 广告位：预留，后续统一接入。不要改动 class 名 -->
      <div class="ad-slot ad-slot-top" aria-label="Advertisement" data-i18n-attr="aria-label:ad.label"></div>

      <div class="panel-content">
        <section class="pui-card" aria-label="Language" data-i18n-attr="aria-label:language.label">
          <label for="xload-language" data-i18n="language.label">Language</label>
          <select id="xload-language" class="pui-input">
            <option value="auto" data-i18n="language.auto">Auto</option>
            <option value="en" data-i18n="language.en">English</option>
            <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
            <option value="zh-TW" data-i18n="language.zhTW">繁體中文</option>
          </select>
        </section>

        <section class="pui-card" aria-label="Settings" data-i18n-attr="aria-label:section.settings">
          <div class="pui-card-head">
            <div><h2 class="pui-card-title" data-i18n="section.settings">Settings</h2></div>
          </div>
          <label class="pui-field" for="xload-retention">
            <span class="pui-label" data-i18n="settings.retention">Keep history for</span>
            <select id="xload-retention" class="pui-input"></select>
          </label>
          <label class="pb-sw">
            <span>
              <strong data-i18n="settings.badge">Show a badge when the price changes</strong>
              <small data-i18n="settings.badgeHelp">Adds a small note on the product page when the price differs from your last visit.</small>
            </span>
            <span class="pui-switch"><input type="checkbox" id="xload-badge"><i></i></span>
          </label>
          <div class="pb-actions">
            <button type="button" class="pui-btn pui-btn-primary" id="xload-save" data-i18n="control.save">Save settings</button>
          </div>
        </section>

        <section class="pui-card" aria-label="Browsed products" data-i18n-attr="aria-label:section.products">
          <div class="pui-card-head">
            <div><h2 class="pui-card-title" data-i18n="section.products">Browsed products</h2></div>
            <span class="pui-badge" id="xload-count" aria-hidden="true"></span>
          </div>
          <div id="xload-products"></div>
        </section>

        <section class="pui-card" aria-label="Category comparison" data-i18n-attr="aria-label:section.compare">
          <div class="pui-card-head">
            <div><h2 class="pui-card-title" data-i18n="section.compare">Category comparison</h2></div>
          </div>
          <div id="xload-compare"></div>
        </section>

        <div class="pb-actions">
          <button type="button" class="pui-btn pui-btn-default" id="xload-viewlogs" data-i18n="control.viewLogs">View logs</button>
          <button type="button" class="pui-btn pui-btn-danger" id="xload-clear" data-i18n="control.clearHistory">Clear history</button>
        </div>
      </div>
    </main>

    <footer class="panel-footer">
      <a href="/" target="_blank" rel="noopener">xload</a>
      <a href="/listing.html" target="_blank" rel="noopener" data-i18n="footer.tools">Tools</a>
      <a href="/privacy-policy.html" target="_blank" rel="noopener" data-i18n="footer.privacy">Privacy</a>
    </footer>
  </div>

  <script src="/assets/panel/panel.js"></script>

          }(row.key));
          top.appendChild(title);
          top.appendChild(removeBtn);
          item.appendChild(top);

          item.appendChild(el('span', 'ph-store', row.store));

          var line = el('div', 'ph-price-line');
          var curWrap = el('span');
          var curLbl = el('span', 'ph-label');
          curLbl.setAttribute('data-i18n', 'state.current');
          curLbl.textContent = i18n.t('state.current');
          curWrap.appendChild(curLbl);
          curWrap.appendChild(el('span', 'ph-value', fmtValue(row)));
          line.appendChild(curWrap);
          renderDrop(line, row);
          if (row.high !== null && row.count > 0) {
            var rangeWrap = el('span');
            i18n.setText(rangeWrap, 'state.priceRange', { low: row.low.toFixed(2), high: row.high.toFixed(2) });
            line.appendChild(rangeWrap);
          }
          item.appendChild(line);

          var meta = el('div', 'ph-meta');
          i18n.setText(meta, 'state.points', { count: row.count });
          item.appendChild(meta);

          var chartWrap = el('div', 'ph-chart');
          chartWrap.appendChild(sparkline(row.chart));
          item.appendChild(chartWrap);

          productsBox.appendChild(item);
        }
      }

      function renderCompare() {
        compareBox.innerHTML = '';
        if (!products || !products.length) return;
        var groups = groupComparison(products);
        if (!groups || !groups.length) {
          var empty = emptyBlock('state.compareEmpty');
          compareBox.appendChild(empty);
          return;
        }
        for (var i = 0; i < groups.length; i++) {
          var grp = groups[i];
          var box = el('div', 'ph-group');
          var title = el('div', 'ph-group-title', grp.store + '  ·  ' + grp.label);
          box.appendChild(title);
          var ul = el('ul', 'pui-list');
          for (var j = 0; j < grp.items.length; j++) {
            var it = grp.items[j];
            var li = el('li');
            var left = el('span');
            left.textContent = it.title || it.id;
            if (j === 0) {
              var cheap = el('span', 'ph-cheap', i18n.t('state.cheapest'));
              left.appendChild(cheap);
            }
            var right = el('strong', null, fmtValue(it));
            li.appendChild(left);
            li.appendChild(right);
            ul.appendChild(li);
          }
          box.appendChild(ul);
          compareBox.appendChild(box);
        }
      }

      // 面板侧的同类分组（与脚本 CORE.buildComparison 一致，仅作用于本地展示）。
      function groupComparison(rows) {
        var STOPWORDS = {
          a:1, an:1, the:1, and:1, or:1, of:1, to:1, in:1, on:1, for:1, with:1, by:1, at:1,
          from:1, is:1, are:1, was:1, as:1, be:1, it:1, this:1, that:1,
          new:1, hot:1, sale:1, free:1, now:1, top:1, best:1, high:1, low:1, quality:1, brand:1,
          original:1, official:1, mini:1, small:1, large:1, size:1, color:1, colour:1,
          red:1, blue:1, black:1, white:1, green:1, yellow:1,
          pcs:1, pc:1, lot:1, set:1, pack:1, box:1, bag:1, pair:1,
          women:1, men:1, kids:1, boy:1, girl:1, baby:1, adult:1, unisex:1
        };
        function tokenize(text) {
          var raw = String(text || '').toLowerCase().split(/[^a-z0-9]+/);
          var out = [];
          for (var i = 0; i < raw.length; i++) {
            var t = raw[i];
            if (!t || t.length < 3) continue;
            if (/^\d+$/.test(t)) continue;
            if (STOPWORDS[t]) continue;
            out.push(t);
          }
          return out;
        }
        if (!rows || rows.length < 2) return [];
        var freq = {}, tokenSets = [];
        for (var i = 0; i < rows.length; i++) {
          var toks = tokenize(rows[i].title);
          tokenSets[i] = toks;
          var seen = {};
          for (var j = 0; j < toks.length; j++) {
            var t = toks[j];
            if (!seen[t]) { seen[t] = 1; freq[t] = (freq[t] || 0) + 1; }
          }
        }
        var groups = {}, order = [];
        for (var r = 0; r < rows.length; r++) {
          var rowTokens = tokenSets[r];
          var best = null, bestScore = -1;
          for (var q = 0; q < rowTokens.length; q++) {
            var tok = rowTokens[q];
            var score = (freq[tok] || 0) * 1000 + tok.length;
            if (score > bestScore) { bestScore = score; best = tok; }
          }
          var cat = best || rows[r].store;
          var gKey = rows[r].store + '|' + cat;
          if (!groups[gKey]) { groups[gKey] = { store: rows[r].store, label: cat, items: [] }; order.push(gKey); }
          groups[gKey].items.push(rows[r]);
        }
        var out = [];
        for (var g = 0; g < order.length; g++) {
          var grp = groups[order[g]];
          if (grp.items.length < 2) continue;
          grp.items.sort(function (a, b) {
            if (a.current === null) return 1;
            if (b.current === null) return -1;
            return a.current - b.current;
          });
          out.push(grp);
        }
        out.sort(function (a, b) {
          return b.items.length - a.items.length || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0);
        });
        return out;
      }

      function refresh() {
        renderRetentionOptions();
        badgeCheckbox.checked = !!settings.showBadge;
        renderProducts();
        renderCompare();
      }

      function loadSnapshot() {
        channel.request('command', { action: 'getSnapshot' }).then(function (state) {
          if (state && state.settings) settings = state.settings;
          products = (state && state.products) || [];
          refresh();
        }).catch(function () { /* 独立打开面板时原页面未响应，保持空态 */ });
      }

      function removeProduct(key) {
        channel.request('command', { action: 'removeProduct', key: key }).then(function (state) {
          products = (state && state.products) || [];
          refresh();
        }).catch(function () { PUI.toast(i18n.t('error.pageUnresponsive'), 'warn'); });
      }

      languageSelect.value = i18n.getPreference();
      languageSelect.addEventListener('change', function () {
        var preference = i18n.setLocale(languageSelect.value);
        languageSelect.value = preference;
        renderRetentionOptions();
        channel.request('command', { action: 'setLanguage', locale: preference }).catch(function () {
          PUI.toast(i18n.t('error.pageUnresponsive'), 'warn');
        });
      });

      saveBtn.addEventListener('click', function () {
        channel.request('command', {
          action: 'saveSettings',
          retentionDays: parseInt(retentionSelect.value, 10),
          showBadge: badgeCheckbox.checked
        }).then(function (state) {
          if (state && state.settings) settings = state.settings;
          refresh();
          PUI.toast(i18n.t('control.saved'), 'success');
        }).catch(function () { PUI.toast(i18n.t('error.pageUnresponsive'), 'warn'); });
      });

      clearBtn.addEventListener('click', function () {
        PUI.modal({
          title: i18n.t('control.clearHistory'),
          body: i18n.t('control.clearHistoryConfirm'),
          buttons: [
            { text: i18n.t('control.close'), type: 'default' },
            {
              text: i18n.t('control.clearHistory'), type: 'danger',
              onClick: function () {
                channel.request('command', { action: 'clearHistory' }).then(function () {
                  products = [];
                  refresh();
                }).catch(function () { PUI.toast(i18n.t('error.pageUnresponsive'), 'warn'); });
              }
            }
          ]
        });
      });

      viewLogsBtn.addEventListener('click', function () {
        channel.request('command', { action: 'getLogs' }).then(function (state) {
          var logs = (state && state.logs) || [];
          var lines = logs.map(function (entry) {
            var data = entry.data == null ? '' : JSON.stringify(entry.data);
            return '[' + entry.at + '] ' + entry.tag + (data ? ' ' + data : '');
          });
          var pre = el('pre', 'pui-log', lines.join('\n') || '—');
          var modal = PUI.modal({
            title: i18n.t('log.title'),
            body: pre,
            buttons: [
              {
                text: i18n.t('control.copyLogs'), type: 'primary',
                onClick: function () {
                  if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(lines.join('\n')).then(function () {
                      PUI.toast(i18n.t('control.saved'), 'success');
                    });
                  }
                }
              },
              { text: i18n.t('control.close'), type: 'default' }
            ]
          });
        }).catch(function () { PUI.toast(i18n.t('error.pageUnresponsive'), 'warn'); });
      });

      channel.on('progress', function (data) {
        if (data && data.type === 'recorded') loadSnapshot();
      });

      channel.request('command', { action: 'getState' }).then(function (state) {
        if (state && state.localePreference) {
          i18n.setLocale(state.localePreference);
          languageSelect.value = state.localePreference;
        }
      }).catch(function () { /* panel preference remains usable independently */ }).then(loadSnapshot);
    })();
  </script>
</body>
</html>
