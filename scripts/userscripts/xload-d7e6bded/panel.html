<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="panel.documentTitle">YouTube SponsorBlock Controls - Panel</title>
  <meta name="description" content="Control SponsorBlock skipping and replay skipped segments on YouTube.">
  <meta name="keywords" content="xload">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body>
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1 data-i18n="title">YouTube SponsorBlock Controls</h1>
        <p class="panel-subtitle" data-i18n="short">Control SponsorBlock skipping and replay skipped segments on YouTube.</p>
      </div>
    </header>

    <main class="panel-main">
      <!-- 广告位：预留，后续统一接入。不要改动 class 名 -->
      <div class="ad-slot ad-slot-top" aria-label="Advertisement" data-i18n-attr="aria-label:ad.label"></div>

      <div class="panel-content">
        <section class="pui-card" aria-label="Language" data-i18n-attr="aria-label:language.label">
          <label for="xload-language" data-i18n="language.label">Language</label>
          <select id="xload-language" class="pui-input">
            <option value="auto" data-i18n="language.auto">Auto</option>
            <option value="en" data-i18n="language.en">English</option>
            <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
            <option value="zh-TW" data-i18n="language.zhTW">繁體中文</option>
          </select>
        </section>
        <!-- ==================== 功能 UI：开发节点按脚本功能填写 ====================
             组件目录：/_preview/fab-panel-preview.html（仓库路径 _preview/fab-panel-preview.html）。
             样式统一 D0 极简黑白（静态）：黑 header、白卡、黑白按钮/开关/滑条，无动画/过渡。
             只能组合共享 panel.css 已定义的 pui-*/pb-* 组件；不得复制组件 CSS、另建主题，
             或重定义颜色、圆角、阴影、动效及基础控件外观。业务 class 仅补组件无法表达的布局。
             内联 <style> 仅黑白（#111/#fff/#d4d4d4/#e5e5e5/#ececec/#f4f4f4/#fafafa，
             次要文字 #555/#888/#a3a3a3），禁止任何彩色系（#2563eb 等）。
             把设置下发给油猴的主按钮文案一律用「保存配置」（toast「已保存配置」）。
        ==================== -->
        <section class="pui-card">
          <p id="connection" class="pb-status" role="status" data-i18n="status.connecting"></p>
          <label class="pui-field" for="mode"><span class="pui-label" data-i18n="segment.mode"></span>
            <select id="mode" class="pui-input"><option value="manual" data-i18n="segment.manual"></option><option value="auto" data-i18n="segment.auto"></option><option value="off" data-i18n="segment.off"></option></select>
          </label>
          <fieldset><legend data-i18n="segment.categoryLabel"></legend><div id="categories" class="pui-form-grid"></div></fieldset>
          <p class="pui-help" data-i18n="segment.savedOffline"></p>
          <div class="pb-btns"><button id="save" type="button" class="pui-btn pui-btn-primary" data-i18n="control.save"></button><button id="refresh" type="button" class="pui-btn pui-btn-default" data-i18n="segment.refresh"></button></div>
        </section>
        <section class="pui-card">
          <p id="video" class="pb-status"></p><p id="result" role="status"></p><p id="playback"></p>
          <label for="segments" data-i18n="segment.list"></label><select id="segments" class="pui-input" size="7"></select>
          <p id="empty" class="pui-empty" data-i18n="segment.empty"></p>
          <div class="pb-btns"><button id="skip" type="button" class="pui-btn pui-btn-default" data-i18n="segment.skip" disabled></button><button id="replay" type="button" class="pui-btn pui-btn-default" data-i18n="segment.replay" disabled></button></div>
          <p id="protection"></p><p id="last-action"></p><p id="error" role="alert"></p>
          <p class="pui-help" data-i18n="segment.help"></p>
        </section>
        <section class="pui-card">
          <div class="pb-btns"><button id="logs-show" type="button" class="pui-btn pui-btn-default" data-i18n="logs.show"></button><button id="logs-copy" type="button" class="pui-btn pui-btn-default" data-i18n="logs.copy"></button></div>
          <pre id="logs" class="pui-log" tabindex="0"></pre>
        </section>
      </div>
    </main>

    <footer class="panel-footer">
      <a href="/" target="_blank" rel="noopener">xload</a>
      <a href="/listing.html" target="_blank" rel="noopener" data-i18n="footer.tools">Tools</a>
      <a href="/privacy-policy.html" target="_blank" rel="noopener" data-i18n="footer.privacy">Privacy</a>
    </footer>
  </div>

        if (applyPolicy && !dirtyPolicy) {
          document.getElementById('mode').value = state.policy.mode;
          categoryRoot.querySelectorAll('input').forEach(function (input) { input.checked = state.policy.categories.includes(input.value); });
        }
        var list = document.getElementById('segments'), selected = list.value;
        list.replaceChildren();
        state.segments.forEach(function (row) {
          var option = document.createElement('option'); option.value = row.id;
          option.textContent = clockText(row.start) + '–' + clockText(row.end) + ' · ' + i18n.t(categoryTranslationKeys[row.category]);
          list.append(option);
        });
        if (state.segments.some(function (row) { return row.id === selected; })) list.value = selected;
        else if (list.options.length) list.selectedIndex = 0;
        document.getElementById('empty').hidden = state.segments.length > 0 || state.fetchState !== 'ready';
        updateButtons();
      }
      async function runCommand(action, extra) {
        if (commandBusy && action !== 'setPolicy') return null;
        commandBusy = true; updateButtons();
        try {
          var result = await channel.request('command', Object.assign({ action: action }, extra || {}), 20000);
          if (!result || !result.ok) {
            i18n.setText(document.getElementById('error'), result && result.messageKey || 'segment.failed');
            return null;
          }
          if (action === 'setPolicy') { dirtyPolicy = false; PUI.toast(i18n.t('control.saved'), 'success'); }
          renderState(result, true); return result;
        } catch (e) { markDisconnected(); return null; }
        finally { commandBusy = false; updateButtons(); }
      }
      document.getElementById('save').addEventListener('click', function () {
        runCommand('setPolicy', { mode: document.getElementById('mode').value, categories: Array.from(categoryRoot.querySelectorAll('input:checked')).map(function (input) { return input.value; }) });
      });
      document.getElementById('refresh').addEventListener('click', function () { runCommand('getSegments'); });
      document.getElementById('segments').addEventListener('change', updateButtons);
      document.getElementById('skip').addEventListener('click', function () {
        if (latestState) runCommand('skipSegment', { segmentId: document.getElementById('segments').value, videoId: latestState.videoId, contextRevision: latestState.contextRevision });
      });
      document.getElementById('replay').addEventListener('click', function () {
        if (latestState) runCommand('replayLast', { videoId: latestState.videoId, contextRevision: latestState.contextRevision });
      });
      document.getElementById('logs-show').addEventListener('click', async function () {
        var result = await runCommand('getLogs');
        if (result) document.getElementById('logs').textContent = JSON.stringify(result.logs, null, 2);
      });
      document.getElementById('logs-copy').addEventListener('click', async function () {
        try { await navigator.clipboard.writeText(document.getElementById('logs').textContent); PUI.toast(i18n.t('logs.copied'), 'success'); }
        catch (e) { PUI.toast(i18n.t('logs.failed'), 'warn'); }
      });
      channel.on('done', function (state) {
        if (state.localePreference && state.localePreference !== i18n.getPreference()) { i18n.setLocale(state.localePreference); languageSelect.value = state.localePreference; }
        renderState(state, true);
      });
      channel.on('progress', function () { i18n.setText(document.getElementById('result'), 'status.fetching'); });
      channel.on('error', function (data) { i18n.setText(document.getElementById('error'), data.messageKey || 'segment.fetchError'); });
      window.setInterval(function () {
        if (commandBusy) return;
        channel.request('command', { action: 'getState' }, 4000).then(function (state) { renderState(state, true); }).catch(markDisconnected);
      }, 5000);
      // ==================== 功能逻辑：开发节点按脚本功能填写 ====================
      // 约定消息类型：
      //   panel -> 油猴： channel.send('command', {...}) 或 channel.request('command', {...})
      //   油猴 -> panel： channel.send('progress', {...}) / channel.send('done', {...})
      // 监听油猴消息： channel.on('progress', function(data){ ... })
      // 动态本地化状态（连接中/已连接/错误/含变量的进度等）必须用
      //   i18n.setText(element, 'status.connected', { count: data.count });
      // 它会同步当前词条和变量，之后 setLocale() 可正确重译当前状态。
      // 用户输入、网址、日志、计数结果等原始数据输出不要带 data-i18n，直接用 textContent。
      //
      // 跨源说明：面板(xload.net)与脚本(目标站点)跨源，BroadcastChannel 同源才互通；
      //   共用壳 panel.js 的 PanelChannel 已封装跨源通道（有 window.opener 走 postMessage，
      //   同源才走 BroadcastChannel），本页无需区分；油猴侧须配套 window.message 监听 +
      //   三级回包（panelWin → event.source → BroadcastChannel） + setPanelWin/getPanelWin。
      //   油猴侧 createChannel 直接用共享模板 templates/channel.js，勿自行重写。
      //
      // 示例（按需删除）：
      // channel.request('greet', { name: 'xload' }, 5000).then(function (data) {
      //   PUI.toast('收到回复：' + data.message, 'success');
      // }).catch(function (e) {
      //   PUI.toast('原页面未响应：' + e.message, 'warn');
      // });
    })();
  </script>
</body>
