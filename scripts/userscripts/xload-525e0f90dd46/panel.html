<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网盘直链下载助手 - 功能面板</title>
  <meta name="description" content="支持百度/阿里/天翼/迅雷/夸克/移动六大网盘直链下载。">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-525e0f90dd46">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>网盘直链下载助手</h1>
        <p class="panel-subtitle">支持百度/阿里/天翼/迅雷/夸克/移动六大网盘直链下载。</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="download">
          <div class="pui-card-head">
            <div class="pui-card-title">下载操作</div>

            <div class="pui-card-desc">先在网盘页面选择文件，再选择下载协议。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-protocol">默认协议</label>
              <select class="pui-input" id="ctl-protocol" data-control="protocol" data-type="select">

                <option value="api" selected>api</option>

                <option value="aria">aria</option>

                <option value="rpc">rpc</option>

                <option value="curl">curl</option>

                <option value="bc">bc</option>

              </select>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="download-api">API 下载</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="download-aria">Aria 下载</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="download-rpc">RPC 下载</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="download-curl">cURL 下载</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="download-bc">BC 下载</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="settings">
          <div class="pui-card-head">
            <div class="pui-card-title">助手设置</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-remember-settings">记住下载器设置</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-remember-settings" data-control="remember-settings" data-type="switch" checked><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="open-settings">打开设置</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
