<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>x-hide-bars - 功能面板</title>
  <meta name="description" content="X mobile: swipe up hides top/bottom bars, stays hidden on stop, swipe down">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-dfedaca73e17">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>x-hide-bars 功能面板</h1>
        <p class="panel-subtitle">X mobile: swipe up hides top/bottom bars, stays hidden on stop, swipe down</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="bars">
          <div class="pui-card-head">
            <div class="pui-card-title">导航栏控制</div>

            <div class="pui-card-desc">控制 X 移动端顶部与底部导航栏的隐藏/恢复状态，或重新扫描页面上的栏位。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-hidden">隐藏导航栏</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-hidden" data-control="hidden" data-type="switch"><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="apply-bars">应用栏状态</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="rescan">重新扫描栏位</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="fab">
          <div class="pui-card-head">
            <div class="pui-card-title">撰写悬浮按钮</div>

            <div class="pui-card-desc">控制右下角撰写悬浮按钮是否保持隐藏。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-hide-fab">隐藏撰写悬浮按钮</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-hide-fab" data-control="hide-fab" data-type="switch" checked><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="apply-fab">应用</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="gesture">
          <div class="pui-card-head">
            <div class="pui-card-title">手势参数</div>

            <div class="pui-card-desc">调整滑动判定阈值与 PageUp 键盘翻页抑制时长。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-threshold">滑动判定阈值(px)</label>
              <input class="pui-input" id="ctl-threshold" data-control="threshold" data-type="number" type="number" value="4">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-key-suppress-ms">PageUp 抑制时长(ms)</label>
              <input class="pui-input" id="ctl-key-suppress-ms" data-control="key-suppress-ms" data-type="number" type="number" value="600">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="apply-gesture">应用手势参数</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
