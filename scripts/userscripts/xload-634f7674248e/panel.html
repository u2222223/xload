<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline SVG Replacer - 功能面板</title>
  <meta name="description" content="Replace all img tags with src as an SVG file into inline SVG tags">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-634f7674248e">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>Inline SVG Replacer 控制面板</h1>
        <p class="panel-subtitle">Replace all img tags with src as an SVG file into inline SVG tags</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="inline-svg">
          <div class="pui-card-head">
            <div class="pui-card-title">SVG 内联替换</div>

            <div class="pui-card-desc">将页面中指向 SVG 文件的 &lt;img&gt; 元素替换为内联 &lt;svg&gt; 元素。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-enabled">启用替换</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-enabled" data-control="enabled" data-type="switch" checked><i></i></label>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-timeout">请求超时（毫秒）</label>
              <input class="pui-input" id="ctl-timeout" data-control="timeout" data-type="number" type="number" value="8000">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-skipExtensions">跳过的位图扩展名（逗号分隔）</label>
              <input class="pui-input" id="ctl-skipExtensions" data-control="skipExtensions" data-type="text" type="text" value="png,jpg,jpeg,gif,webp,bmp,ico,avif,apng,tiff,tif">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-debug">输出调试日志</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-debug" data-control="debug" data-type="switch"><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="inline">立即内联替换</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="scan">扫描候选图片</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
