<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Metersphere Test Report - 功能面板</title>
  <meta name="description" content="生成 Metersphere 测试计划报告">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-fe250f0d6465">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>Metersphere 测试报告生成器</h1>
        <p class="panel-subtitle">生成 Metersphere 测试计划报告</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="report">
          <div class="pui-card-head">
            <div class="pui-card-title">测试报告</div>

            <div class="pui-card-desc">根据 Metersphere 测试计划生成并下载 CSV 报告；不填写计划 ID 时使用当前页面地址中的计划。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-planId">测试计划 ID</label>
              <input class="pui-input" id="ctl-planId" data-control="planId" data-type="text" type="text" value="">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="download">生成并下载报告</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="account">
          <div class="pui-card-head">
            <div class="pui-card-title">账号设置</div>

            <div class="pui-card-desc">Metersphere 登录账号，仅保存在浏览器本地，用于获取报告数据。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-username">用户名</label>
              <input class="pui-input" id="ctl-username" data-control="username" data-type="text" type="text" value="">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-password">密码</label>
              <input class="pui-input" id="ctl-password" data-control="password" data-type="text" type="text" value="">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="saveAccount">保存账号</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="clearAccount">清除账号</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
