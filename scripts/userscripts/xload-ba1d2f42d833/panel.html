<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 代码搜索 Star &amp; 更新时间排序助手 - 功能面板</title>
  <meta name="description" content="在 GitHub 代码搜索结果中显示仓库 Star 数和文件/仓库更新时间（数据到达即实时渲染），支持双日期排序、恢复默认、跨页扫描汇总，点击可跳转到对应文件行">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-ba1d2f42d833">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>GitHub 代码搜索排序助手</h1>
        <p class="panel-subtitle">在 GitHub 代码搜索结果中显示仓库 Star 数和文件/仓库更新时间（数据到达即实时渲染），支持双日期排序、恢复默认、跨页扫描汇总，点击可跳转到对应文件行</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="result-sorting">
          <div class="pui-card-head">
            <div class="pui-card-title">当前页排序</div>

            <div class="pui-card-desc">按仓库 Star、文件更新时间或仓库更新时间整理当前搜索结果。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-sortBy">排序字段</label>
              <select class="pui-input" id="ctl-sortBy" data-control="sortBy" data-type="select">

                <option value="Star" selected>Star</option>

                <option value="文件更新时间">文件更新时间</option>

                <option value="仓库更新时间">仓库更新时间</option>

              </select>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-ascending">升序排列</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-ascending" data-control="ascending" data-type="switch"><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="sort-results">应用排序</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="reset-order">恢复默认顺序</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="page-scanning">
          <div class="pui-card-head">
            <div class="pui-card-title">跨页扫描</div>

            <div class="pui-card-desc">扫描多页代码搜索结果，并汇总 Star 与更新时间。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-scanPages">扫描页数（1-20）</label>
              <input class="pui-input" id="ctl-scanPages" data-control="scanPages" data-type="number" type="number" value="3">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="scan-pages">开始扫描并汇总</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
