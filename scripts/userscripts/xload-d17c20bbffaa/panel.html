<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuTracker Full-Text Search in Topics - 功能面板</title>
  <meta name="description" content="Allows to search for text on all pages of RuTracker topics">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-d17c20bbffaa">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>主题全文搜索</h1>
        <p class="panel-subtitle">Allows to search for text on all pages of RuTracker topics</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="search">
          <div class="pui-card-head">
            <div class="pui-card-title">搜索设置</div>

            <div class="pui-card-desc">在当前主题的全部页面中检索文本，并高亮显示命中内容</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-query">搜索词</label>
              <input class="pui-input" id="ctl-query" data-control="query" data-type="text" type="text" value="">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-search-nick">按作者昵称搜索</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-search-nick" data-control="search-nick" data-type="switch"><i></i></label>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-newest-first">新消息在顶部</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-newest-first" data-control="newest-first" data-type="switch"><i></i></label>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-fetch-delay">翻页请求间隔（毫秒）</label>
              <input class="pui-input" id="ctl-fetch-delay" data-control="fetch-delay" data-type="number" type="number" value="500">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="search">执行搜索</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="clear-results">清除结果</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
