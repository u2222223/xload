<html lang="zh-CN">
<head>

     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面调试助手 - 功能面板</title>
  <meta name="description" content="在页面上屏蔽指定元素、加载元素间距标注工具、执行自定义脚本并查看页面调试信息。">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-90417d328263">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>页面调试助手</h1>
        <p class="panel-subtitle">在页面上屏蔽指定元素、加载元素间距标注工具、执行自定义脚本并查看页面调试信息。</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="element-tools">
          <div class="pui-card-head">
            <div class="pui-card-title">元素工具</div>

            <div class="pui-card-desc">针对当前页面元素执行操作，命令发出后请在页面上完成交互。</div>

          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="block_element">屏蔽元素</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="load_spacing">加载间距标注</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="script-info">
          <div class="pui-card-head">
            <div class="pui-card-title">脚本与信息</div>

            <div class="pui-card-desc">执行自定义脚本或查看当前页面的调试信息。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-code">JavaScript 代码</label>
              <input class="pui-input" id="ctl-code" data-control="code" data-type="text" type="text" value="alert(&#39;Hello&#39;)">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="run_js">执行脚本</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="debug_info">查看调试信息</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"执行完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
