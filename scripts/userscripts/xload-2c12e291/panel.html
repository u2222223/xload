<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="panel.documentTitle">YouTube Ad Controls - Panel</title>
  <meta name="description" content="Manage targeted ad handling on YouTube with an immediate off switch.">
  <meta name="keywords" content="xload">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body>
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1 data-i18n="title">YouTube Ad Controls</h1>
        <p class="panel-subtitle" data-i18n="short">Manage targeted ad handling on YouTube with an immediate off switch.</p>
      </div>
    </header>

    <main class="panel-main">
      <!-- 广告位：预留，后续统一接入。不要改动 class 名 -->
      <div class="ad-slot ad-slot-top" aria-label="Advertisement" data-i18n-attr="aria-label:ad.label"></div>

      <div class="panel-content">
        <section class="pui-card" aria-label="Language" data-i18n-attr="aria-label:language.label">
          <label for="xload-language" data-i18n="language.label">Language</label>
          <select id="xload-language" class="pui-input">
            <option value="auto" data-i18n="language.auto">Auto</option>
            <option value="en" data-i18n="language.en">English</option>
            <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
            <option value="zh-TW" data-i18n="language.zhTW">繁體中文</option>
          </select>
        </section>
        <!-- ==================== 功能 UI：开发节点按脚本功能填写 ====================
             组件目录：/_preview/fab-panel-preview.html（仓库路径 _preview/fab-panel-preview.html）。
             样式统一 D0 极简黑白（静态）：黑 header、白卡、黑白按钮/开关/滑条，无动画/过渡。
             只能组合共享 panel.css 已定义的 pui-*/pb-* 组件；不得复制组件 CSS、另建主题，
             或重定义颜色、圆角、阴影、动效及基础控件外观。业务 class 仅补组件无法表达的布局。
             内联 <style> 仅黑白（#111/#fff/#d4d4d4/#e5e5e5/#ececec/#f4f4f4/#fafafa，
             次要文字 #555/#888/#a3a3a3），禁止任何彩色系（#2563eb 等）。
             把设置下发给油猴的主按钮文案一律用「保存配置」（toast「已保存配置」）。
        ==================== -->
        <section class="pui-card">
          <p id="connection" class="pb-status" role="status" data-i18n="status.connecting"></p>
          <h2 data-i18n="ad.policyLabel"></h2>
          <p><span data-i18n="ad.host"></span>: <strong id="current-host">—</strong></p>
          <label class="pb-sw"><span data-i18n="ad.page"></span><span class="pui-switch"><input id="page-ads" type="checkbox" disabled><i aria-hidden="true"></i></span></label>
          <label class="pb-sw"><span data-i18n="ad.player"></span><span class="pui-switch"><input id="player-ads" type="checkbox" disabled><i aria-hidden="true"></i></span></label>
          <div class="pb-btns">
            <button id="save-policy" class="pui-btn pui-btn-primary" type="button" data-i18n="control.save" disabled></button>
            <button id="disable-all" class="pui-btn pui-btn-default" type="button" data-i18n="ad.disable" disabled></button>
            <button id="restore-hidden" class="pui-btn pui-btn-default" type="button" data-i18n="ad.restore" disabled></button>
            <button id="refresh-state" class="pui-btn pui-btn-default" type="button" data-i18n="ad.refresh"></button>
          </div>
          <p class="pui-help" data-i18n="ad.help"></p>
          <p id="player-state" role="status"></p>
          <p id="result-status" role="status"></p>
        </section>
        <section class="pui-card">
          <h2 data-i18n="ad.recent"></h2>
          <p id="action-counts"></p>
          <label class="pui-field"><span data-i18n="ad.filter"></span><input id="action-filter" class="pui-input" type="search"></label>
          <p id="empty-actions" class="pui-empty" data-i18n="ad.empty"></p>
          <pre id="action-log" class="pui-log" tabindex="0"></pre>
          <div class="pb-btns">
            <button id="clear-log" class="pui-btn pui-btn-default" type="button" data-i18n="ad.clear" disabled></button>
            <button id="copy-log" class="pui-btn pui-btn-default" type="button" data-i18n="ad.copy"></button>
          </div>
          <details id="diagnostics"><summary data-i18n="ad.logs"></summary><pre id="diagnostic-log" class="pui-log" tabindex="0"></pre></details>
        </section>
        <section class="pui-card">
          <p data-i18n="ad.limit"></p>
          <p data-i18n="ad.privacy"></p>
        </section>
      </div>
    </main>

    <footer class="panel-footer">
      <a href="/" target="_blank" rel="noopener">xload</a>
      <a href="/listing.html" target="_blank" rel="noopener" data-i18n="footer.tools">Tools</a>
      <a href="/privacy-policy.html" target="_blank" rel="noopener" data-i18n="footer.privacy">Privacy</a>
    </footer>
  </div>

  <script src="/assets/panel/panel.js"></script>

        var status = ['disabled', 'idle', 'skip', 'seek', 'unmatched'].indexOf(state.playerAdState) >= 0 ? state.playerAdState : 'unmatched';
        i18n.setText(document.getElementById('player-state'), 'status.' + status);
        var counts = state.counts || {};
        i18n.setText(document.getElementById('action-counts'), 'ad.counts', {
          hidden: state.hiddenCount || 0, hide: counts.hide || 0, skip: counts.skip || 0,
          seek: counts.seek || 0, unmatched: counts.unmatched || 0, errors: counts.errors || 0
        });
        renderActionLogs();
      }

      function runAdCommand(action, extra) {
        if (inFlight) return Promise.resolve(null);
        inFlight = true;
        enableControls(false);
        return channel.request('command', Object.assign({ action: action }, extra || {})).then(function (state) {
          if (!state || state.ok !== true) {
            var errorKey = state && Object.prototype.hasOwnProperty.call(I18N_DICT.en, state.messageKey) ? state.messageKey : 'error.operation';
            showResult(errorKey);
            // Keep recovery actions available when a previous connection returned an operation error.
            enableControls(!!latestState);
            return null;
          }
          renderAdState(state, ['setAdPolicy', 'disableAll', 'restoreHidden'].indexOf(action) >= 0);
          enableControls(true);
          if (action === 'setAdPolicy') {
            showResult('control.saved');
            i18n.setText(PUI.toast(i18n.t('control.saved'), 'success'), 'control.saved');
          } else if (action === 'disableAll' || action === 'restoreHidden') showResult('status.restored', { count: state.restoredCount || 0 });
          else if (action === 'clearAdLog') showResult('status.cleared');
          return state;
        }).catch(function () {
          i18n.setText(connection, 'status.disconnected');
          enableControls(false);
          return null;
        }).finally(function () { inFlight = false; });
      }

      pageSwitch.addEventListener('change', function () { dirtyPolicy = true; });
      playerSwitch.addEventListener('change', function () { dirtyPolicy = true; });
      filterInput.addEventListener('input', renderActionLogs);
      document.getElementById('save-policy').addEventListener('click', function () {
        if (latestState) runAdCommand('setAdPolicy', { host: latestState.host, pageAds: pageSwitch.checked, playerAds: playerSwitch.checked });
      });
      document.getElementById('disable-all').addEventListener('click', function () { runAdCommand('disableAll'); });
      document.getElementById('restore-hidden').addEventListener('click', function () { runAdCommand('restoreHidden'); });
      document.getElementById('clear-log').addEventListener('click', function () { runAdCommand('clearAdLog'); });
      document.getElementById('refresh-state').addEventListener('click', function () { runAdCommand('getAdState'); });
      document.getElementById('copy-log').addEventListener('click', function () {
        var value = document.getElementById('action-log').textContent;
        if (document.getElementById('diagnostics').open) value += '\n' + document.getElementById('diagnostic-log').textContent;
        if (!navigator.clipboard) { showResult('error.copy'); return; }
        navigator.clipboard.writeText(value).then(function () { showResult('ad.copied'); }, function () { showResult('error.copy'); });
      });
      channel.on('progress', function (data) {
        if (data && data.stage === 'restored') showResult('status.restored', { count: data.restoredCount || 0 });
      });
      channel.on('error', function (data) {
        showResult(data && Object.prototype.hasOwnProperty.call(I18N_DICT.en, data.messageKey) ? data.messageKey : 'error.operation');
      });
      runAdCommand('getState');
      var refreshTimer = setInterval(function () {
        if (!document.hidden) runAdCommand('getAdState');
      }, 3000);
      window.addEventListener('pagehide', function () { clearInterval(refreshTimer); channel.close(); });
      // ==================== 功能逻辑：开发节点按脚本功能填写 ====================
      // 约定消息类型：
      //   panel -> 油猴： channel.send('command', {...}) 或 channel.request('command', {...})
      //   油猴 -> panel： channel.send('progress', {...}) / channel.send('done', {...})
      // 监听油猴消息： channel.on('progress', function(data){ ... })
      // 动态本地化状态（连接中/已连接/错误/含变量的进度等）必须用
      //   i18n.setText(element, 'status.connected', { count: data.count });
      // 它会同步当前词条和变量，之后 setLocale() 可正确重译当前状态。
      // 用户输入、网址、日志、计数结果等原始数据输出不要带 data-i18n，直接用 textContent。
      //
      // 跨源说明：面板(xload.net)与脚本(目标站点)跨源，BroadcastChannel 同源才互通；
      //   共用壳 panel.js 的 PanelChannel 已封装跨源通道（有 window.opener 走 postMessage，
      //   同源才走 BroadcastChannel），本页无需区分；油猴侧须配套 window.message 监听 +
      //   三级回包（panelWin → event.source → BroadcastChannel） + setPanelWin/getPanelWin。
      //   油猴侧 createChannel 直接用共享模板 templates/channel.js，勿自行重写。
      //
      // 示例（按需删除）：
      // channel.request('greet', { name: 'xload' }, 5000).then(function (data) {
      //   PUI.toast('收到回复：' + data.message, 'success');
      // }).catch(function (e) {
      //   PUI.toast('原页面未响应：' + e.message, 'warn');
      // });
    })();
  </script>
</body>
</html>
