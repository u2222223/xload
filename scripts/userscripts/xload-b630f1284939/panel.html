<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilibili-banned-contents-hider - 功能面板</title>
  <meta name="description" content="Hide banned users&#39; contents on Bilibili. Bilibili may push content created by">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-b630f1284939">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>Bilibili黑名单内容隐藏</h1>
        <p class="panel-subtitle">Hide banned users&#39; contents on Bilibili. Bilibili may push content created by</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="hiding">
          <div class="pui-card-head">
            <div class="pui-card-title">内容隐藏</div>

            <div class="pui-card-desc">控制广告与黑名单内容的隐藏开关，并可立即重新扫描当前页面</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-hide-ads">隐藏广告及推广内容</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-hide-ads" data-control="hide-ads" data-type="switch" checked><i></i></label>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-hide-blacklist">隐藏黑名单用户的内容</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-hide-blacklist" data-control="hide-blacklist" data-type="switch" checked><i></i></label>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="rescan-page">重新扫描当前页面</button>

          </div>

        </section>

        <section class="pui-card panel-section" data-section="blacklist">
          <div class="pui-card-head">
            <div class="pui-card-title">黑名单同步</div>

            <div class="pui-card-desc">从Bilibili账号接口分页拉取黑名单用户，并缓存到本地以便离线回退</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-blacklist-size">黑名单用户数量</label>
              <input class="pui-input" id="ctl-blacklist-size" data-control="blacklist-size" data-type="number" type="number" value="0">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="refresh-blacklist">立即刷新黑名单</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
