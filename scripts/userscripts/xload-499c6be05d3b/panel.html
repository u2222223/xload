<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiceNow - Update Ticket Number - 功能面板</title>
  <meta name="description" content="Replace the number input field with a link to the current ticket">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-499c6be05d3b">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>ServiceNow - Update Ticket Number</h1>
        <p class="panel-subtitle">Replace the number input field with a link to the current ticket</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="display">
          <div class="pui-card-head">
            <div class="pui-card-title">显示设置</div>

            <div class="pui-card-desc">控制编号字段的替换与复制图标显示</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-enableLink">将编号输入框替换为工单链接</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-enableLink" data-control="enableLink" data-type="switch" checked><i></i></label>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-showCopyIcon">显示复制编号图标</label>
              <label class="pui-switch"><input type="checkbox" id="ctl-showCopyIcon" data-control="showCopyIcon" data-type="switch" checked><i></i></label>
            </div>


          </div>


        </section>

        <section class="pui-card panel-section" data-section="actions">
          <div class="pui-card-head">
            <div class="pui-card-title">快捷操作</div>

            <div class="pui-card-desc">一键复制当前工单信息</div>

          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="copyUrl">复制工单链接</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="copyNumber">复制工单编号</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在执行…","done":"已完成","failed":"执行失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
