<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0DTNNMN4ZX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0DTNNMN4ZX');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>文本朗读助手 - 功能面板</title>
  <meta name="description" content="使用浏览器语音合成朗读选中或输入的文本，可调节语速、音调、音量与语言。">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-b52c81e0639f">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>文本朗读助手</h1>
        <p class="panel-subtitle">使用浏览器语音合成朗读选中或输入的文本，可调节语速、音调、音量与语言。</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="speech">
          <div class="pui-card-head">
            <div class="pui-card-title">朗读设置</div>

            <div class="pui-card-desc">输入待朗读文本，或留空使用页面选中文本。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-text">朗读文本</label>
              <input class="pui-input" id="ctl-text" data-control="text" data-type="text" type="text" value="">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-lang">朗读语言</label>
              <select class="pui-input" id="ctl-lang" data-control="lang" data-type="select">

                <option value="zh-CN" selected>zh-CN</option>

                <option value="zh-TW">zh-TW</option>

                <option value="en-US">en-US</option>

                <option value="ja-JP">ja-JP</option>

              </select>
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-rate">语速（0.1 - 10）</label>
              <input class="pui-input" id="ctl-rate" data-control="rate" data-type="number" type="number" value="1">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-pitch">音调（0 - 2）</label>
              <input class="pui-input" id="ctl-pitch" data-control="pitch" data-type="number" type="number" value="1">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-volume">音量（0 - 1）</label>
              <input class="pui-input" id="ctl-volume" data-control="volume" data-type="number" type="number" value="1">
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="speak">开始朗读</button>

            <button class="pui-btn pui-btn-primary" type="button" data-action="stop">停止朗读</button>

          </div>

        </section>


      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在朗读…","done":"朗读完成","failed":"朗读失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
