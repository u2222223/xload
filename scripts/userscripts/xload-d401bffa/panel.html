<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="panel.documentTitle">Discord bulk delete messages with preview and stop controls - Panel</title>
  <meta name="description" content="Preview and delete messages in Discord channels or DMs with adjustable delays, progress counts, and a stop control.">
  <meta name="keywords" content="xload">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body>
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1 data-i18n="title">Discord bulk delete messages with preview and stop controls</h1>
        <p class="panel-subtitle" data-i18n="short">Preview and delete messages in Discord channels or DMs with adjustable delays, progress counts, and a stop control.</p>
      </div>
    </header>

    <main class="panel-main">
      <!-- 广告位：预留，后续统一接入。不要改动 class 名 -->
      <div class="ad-slot ad-slot-top" aria-label="Advertisement" data-i18n-attr="aria-label:ad.label"></div>

      <div class="panel-content">
        <section class="pui-card" aria-label="Language" data-i18n-attr="aria-label:language.label">
          <label for="xload-language" data-i18n="language.label">Language</label>
          <select id="xload-language" class="pui-input">
            <option value="auto" data-i18n="language.auto">Auto</option>
            <option value="en" data-i18n="language.en">English</option>
            <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
            <option value="zh-TW" data-i18n="language.zhTW">繁體中文</option>
          </select>
        </section>
        <!-- ==================== 功能 UI：开发节点按脚本功能填写 ====================
             组件目录：/_preview/fab-panel-preview.html（仓库路径 _preview/fab-panel-preview.html）。
             样式统一 D0 极简黑白（静态）：黑 header、白卡、黑白按钮/开关/滑条，无动画/过渡。
             只能组合共享 panel.css 已定义的 pui-*/pb-* 组件；不得复制组件 CSS、另建主题，
             或重定义颜色、圆角、阴影、动效及基础控件外观。业务 class 仅补组件无法表达的布局。
             内联 <style> 仅黑白（#111/#fff/#d4d4d4/#e5e5e5/#ececec/#f4f4f4/#fafafa，
             次要文字 #555/#888/#a3a3a3），禁止任何彩色系（#2563eb 等）。
             把设置下发给油猴的主按钮文案一律用「保存配置」（toast「已保存配置」）。
        ==================== -->
        <section class="pui-card">
          <h2 class="pui-card-title" data-i18n="scope"></h2>
          <p class="pui-help" data-i18n="help"></p>
          <p id="connection" class="pb-status" role="status" data-i18n="status.connecting"></p>
          <div class="pui-form-grid">
            <label class="pui-field"><span class="pui-label" data-i18n="scope"></span><select id="scopeType" class="pui-input"><option value="channel" data-i18n="scope.channel"></option><option value="dm" data-i18n="scope.dm"></option><option value="server" data-i18n="scope.server"></option></select></label>
            <label class="pui-field"><span class="pui-label" data-i18n="author"></span><input id="authorId" class="pui-input" inputmode="numeric" autocomplete="off" maxlength="20"></label>
            <label class="pui-field"><span class="pui-label" data-i18n="guild"></span><input id="guildId" class="pui-input" autocomplete="off" maxlength="20"></label>
            <label class="pui-field"><span class="pui-label" data-i18n="conversation"></span><input id="channelId" class="pui-input" inputmode="numeric" autocomplete="off" maxlength="20"></label>
          </div>
          <div class="pb-btns"><button id="identify" class="pui-btn pui-btn-default" disabled data-i18n="identify"></button><button id="scan" class="pui-btn pui-btn-primary" disabled data-i18n="scan"></button></div>
        </section>
        <section class="pui-card">
          <label class="pui-field"><span class="pui-label" data-i18n="delayLabel"></span><input id="delayMs" class="pui-input" type="number" min="1000" max="60000" step="100" value="1500"><span class="pui-help" data-i18n="delayHelp"></span></label>
          <button id="save" class="pui-btn pui-btn-primary" disabled data-i18n="control.save"></button>
        </section>
        <section class="pui-card">
          <h2 class="pui-card-title" data-i18n="preview"></h2>
          <p id="preview-count" class="pui-help" data-i18n="noPreview"></p>
          <ul id="samples" class="pui-list"></ul>
          <label class="pb-sw"><span data-i18n="confirm"></span><span class="pui-switch"><input id="confirmed" type="checkbox" disabled><i></i></span></label>
          <p class="pui-help" data-i18n="risk"></p>
          <div class="pb-btns"><button id="start" class="pui-btn pui-btn-danger" disabled data-i18n="erase"></button><button id="stop" class="pui-btn pui-btn-default" disabled data-i18n="stop"></button><button id="resume" class="pui-btn pui-btn-default" hidden data-i18n="resume"></button></div>
          <p id="phase" class="pb-status" role="status" data-i18n="noPreview"></p>
          <p id="counts" class="pui-help"></p>
          <p id="error" class="pui-help" role="alert"></p>
        </section>
        <section class="pui-card">
          <div class="pb-btns"><button id="logs" class="pui-btn pui-btn-default" disabled data-i18n="logs"></button><button id="copy-logs" class="pui-btn pui-btn-default" data-i18n="copyLogs"></button></div>
          <pre id="log-output" class="pui-log" tabindex="0" data-i18n-attr="aria-label:logs"></pre>
        </section>
      </div>
    </main>

    <footer class="panel-footer">
      <a href="/" target="_blank" rel="noopener">xload</a>
      <a href="/listing.html" target="_blank" rel="noopener" data-i18n="footer.tools">Tools</a>
      <a href="/privacy-policy.html" target="_blank" rel="noopener" data-i18n="footer.privacy">Privacy</a>
    </footer>
  </div>

    function t(key, vars) {
      var locale = getLocale();
      var current = dictionary[locale] || {};
      var english = dictionary.en || {};
      var value = current[key];
      if (typeof value !== 'string') value = english[key];
      if (typeof value !== 'string') value = key;
      return value.replace(/\{([a-zA-Z0-9_]+)\}/g, function (_, name) {
        return vars && Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : '{' + name + '}';
      });
    }

    function setText(element, key, vars) {
      if (!element || typeof element.setAttribute !== 'function') return element;
      var normalizedKey = String(key || '');
      element.setAttribute('data-i18n', normalizedKey);
      if (dynamicText) dynamicText.set(element, { key: normalizedKey, vars: vars || null });
      element.textContent = t(normalizedKey, vars);
      return element;
    }

    function apply(root) {
      var scope = root || document;
      var textNodes = scope.querySelectorAll ? scope.querySelectorAll('[data-i18n]') : [];
      for (var i = 0; i < textNodes.length; i++) {
        var saved = dynamicText && dynamicText.get(textNodes[i]);
        var key = saved ? saved.key : textNodes[i].getAttribute('data-i18n');
        textNodes[i].textContent = t(key, saved && saved.vars);
      }
      var attrNodes = scope.querySelectorAll ? scope.querySelectorAll('[data-i18n-attr]') : [];
      for (var j = 0; j < attrNodes.length; j++) {
        var specs = String(attrNodes[j].getAttribute('data-i18n-attr') || '').split(',');
        for (var k = 0; k < specs.length; k++) {
          var pair = specs[k].split(':');
          var attr = String(pair.shift() || '').trim().toLowerCase();
          var key = pair.join(':').trim();
          if (allowedAttributes[attr] && key) attrNodes[j].setAttribute(attr, t(key));
        }
      }
      try { if (document.documentElement) document.documentElement.lang = getLocale(); } catch (e) { /* ignore */ }
      return api;
    }

    function setLocale(value) {
      var locale = allowedLocales.indexOf(value) >= 0 ? value : 'auto';
      writePreference(locale);
      apply();
      return locale;
    }

    var api = { taskId: String(taskId || ''), t: t, setText: setText, apply: apply, getLocale: getLocale, getPreference: readPreference, setLocale: setLocale, normalizeLocale: normalizeLocale };
    return api;
  }

      var i18n = createI18n('xload-d401bffa', I18N_DICT, {
        get: function (key, fallback) {
          try { var value = localStorage.getItem('xload-d401bffa:i18n:' + key); return value == null ? fallback : value; }
          catch (e) { return fallback; }
        },
        set: function (key, value) {
          try { localStorage.setItem('xload-d401bffa:i18n:' + key, value); } catch (e) { /* denied storage */ }
        }
      });
      i18n.apply();
      var channel = new PanelChannel('xload-d401bffa');
      if (typeof PUI.setTranslator === 'function') PUI.setTranslator(i18n.t);
      channel.translate = i18n.t;
      var languageSelect = document.getElementById('xload-language');
      languageSelect.value = i18n.getPreference();
      languageSelect.addEventListener('change', function () {
        var preference = i18n.setLocale(languageSelect.value);
        languageSelect.value = preference;
        channel.request('command', { action: 'setLanguage', locale: preference }).catch(function () {
          PUI.toast(i18n.t('error.pageUnresponsive'), 'warn');
        });
      });
      var connected = false;
      var pending = false;
      var busy = false;
      var currentJob = null;
      var currentPreview = null;
      var firstState = true;
      var polling = false;
      var formEdited = false;
      var fieldNames = ['scopeType', 'authorId', 'guildId', 'channelId'];
      function element(id) { return document.getElementById(id); }
      function draftScope() {
        var value = {};
        fieldNames.forEach(function (name) { value[name] = element(name).value.trim(); });
        if (value.scopeType === 'dm') value.guildId = '@me';
        if (value.scopeType === 'server') value.channelId = '';
        return value;
      }
      function sameScope(left, right) {
        return left && right && fieldNames.every(function (key) { return left[key] === right[key]; });
      }
      function updateControls() {
        fieldNames.forEach(function (name) { element(name).disabled = busy || pending; });
        element('guildId').disabled = busy || pending || element('scopeType').value === 'dm';
        element('channelId').disabled = busy || pending || element('scopeType').value === 'server';
        ['identify', 'scan', 'save'].forEach(function (id) { element(id).disabled = !connected || busy || pending; });
        element('logs').disabled = !connected || pending;
        element('delayMs').disabled = busy || pending;
        var ready = !!currentPreview && currentPreview.found > 0 && sameScope(draftScope(), currentPreview.scope);
        element('confirmed').disabled = !connected || busy || pending || !ready;
        element('start').disabled = element('confirmed').disabled || !element('confirmed').checked;
        element('stop').disabled = !connected || !busy;
        element('resume').hidden = !(currentJob && currentJob.phase === 'paused');
        element('resume').disabled = !connected || pending;
      }
      function clearError() { element('error').removeAttribute('data-i18n'); element('error').textContent = ''; }
      function showError(code) {
        var key = Object.prototype.hasOwnProperty.call(I18N_DICT.en, 'error.' + code) ? 'error.' + code : 'error.HTTP';
        i18n.setText(element('error'), key);
      }
      function renderPreview(value) {
        if ((!value && currentPreview) || (value && (!currentPreview || value.previewId !== currentPreview.previewId))) element('confirmed').checked = false;
        currentPreview = value;
        element('samples').replaceChildren();
        if (!value) i18n.setText(element('preview-count'), 'noPreview');
        else {
          i18n.setText(element('preview-count'), value.found ? 'previewCount' : 'empty', { count: value.found });
          (value.samples || []).slice(0, 20).forEach(function (row) {
            var item = document.createElement('li');
            item.textContent = String(row.number) + ' · ' + (row.timestamp || '—');
            element('samples').appendChild(item);
          });
        }
        updateControls();
      }
      function renderJob(value, active) {
        currentJob = value;
        busy = !!active;
        if (value) {
          i18n.setText(element('phase'), 'status.' + value.phase, { seconds: Math.ceil((value.waitingMs || 0) / 1000) });
          i18n.setText(element('counts'), 'counts', value);
          if (value.code && !['COMPLETE', 'STOPPED'].includes(value.code)) showError(value.code);
        }
        updateControls();
      }
      async function request(action, extra) {
        var result;
        try { result = await channel.request('command', Object.assign({ action: action }, extra || {})); }
        catch (error) {
          connected = false;
          i18n.setText(element('connection'), 'status.offline');
          updateControls();
          throw error;
        }
        connected = true;
        i18n.setText(element('connection'), 'status.connected');
        if (!result || result.ok === false) { showError(result && result.code); throw new Error('command'); }
        return result;
      }
      async function refreshState() {
        if (polling || pending) return;
        polling = true;
        try {
          var state = await request('getState');
          if (firstState) {
            firstState = false;
            i18n.setLocale(state.localePreference || 'auto');
            languageSelect.value = i18n.getPreference();
            element('delayMs').value = state.delayMs;
            if (state.preview && !formEdited) fieldNames.forEach(function (name) { element(name).value = state.preview.scope[name]; });
          }
          renderPreview(state.preview);
          renderJob(state.job, state.active);
        } catch (error) { /* connection status remains visible */ }
        finally { polling = false; updateControls(); }
      }
      async function runCommand(action, values, apply) {
        if (pending) return;
        pending = true;
        clearError();
        updateControls();
        try {
          var result = await request(action, values);
          if (apply) apply(result);
        } catch (error) { /* localized status is set by request */ }
        finally { pending = false; updateControls(); refreshState(); }
      }
      fieldNames.forEach(function (name) {
        element(name).addEventListener('input', function () {
          formEdited = true;
          if (element('scopeType').value === 'dm') element('guildId').value = '@me';
          renderPreview(null);
          // Invalidation also prevents a delayed/repeated start from using an old preview.
          request('invalidate').catch(function () {});
          updateControls();
        });
      });
      element('confirmed').addEventListener('change', updateControls);
      element('identify').addEventListener('click', function () {
        runCommand('identify', null, function (result) {
          fieldNames.forEach(function (name) { element(name).value = result.scope[name]; });
          formEdited = true;
          renderPreview(null);
        });
      });
      element('save').addEventListener('click', function () {
        runCommand('saveSettings', { delayMs: Number(element('delayMs').value) }, function () { PUI.toast(i18n.t('control.saved'), 'success'); });
      });
      element('scan').addEventListener('click', function () {
        runCommand('scan', draftScope(), function (result) { renderPreview(null); busy = true; currentJob = { jobId: result.jobId, phase: 'scan' }; });
      });
      element('start').addEventListener('click', function () {
        if (!currentPreview || !element('confirmed').checked || !sameScope(draftScope(), currentPreview.scope)) return;
        runCommand('start', { previewId: currentPreview.previewId, confirmed: true, delayMs: Number(element('delayMs').value) }, function (result) { renderPreview(null); busy = true; currentJob = { jobId: result.jobId, phase: 'delete' }; });
      });
      element('stop').addEventListener('click', function () {
        // Stop is deliberately available even while a different command is pending.
        if (currentJob) request('stop', { jobId: currentJob.jobId }).then(refreshState).catch(function () {});
      });
      element('resume').addEventListener('click', function () {
        if (currentJob) runCommand('resume', { jobId: currentJob.jobId, confirmed: true });
      });
      element('logs').addEventListener('click', function () {
        runCommand('getLogs', null, function (result) { element('log-output').textContent = JSON.stringify(result.logs, null, 2); });
      });
      element('copy-logs').addEventListener('click', async function () {
        try { await navigator.clipboard.writeText(element('log-output').textContent); PUI.toast(i18n.t('copied'), 'success'); }
        catch (error) { PUI.toast(i18n.t('copyFailed'), 'warn'); }
      });
      channel.on('preview', renderPreview);
      channel.on('progress', function (data) { renderJob(data, true); });
      channel.on('error', function (data) { renderJob(data, !!data.recoverable); });
      channel.on('done', function (data) { renderJob(data, false); refreshState(); });
      refreshState();
      setInterval(refreshState, 2500);
      // ==================== 功能逻辑：开发节点按脚本功能填写 ====================
      // 约定消息类型：
      //   panel -> 油猴： channel.send('command', {...}) 或 channel.request('command', {...})
      //   油猴 -> panel： channel.send('progress', {...}) / channel.send('done', {...})
      // 监听油猴消息： channel.on('progress', function(data){ ... })
      // 动态本地化状态（连接中/已连接/错误/含变量的进度等）必须用
      //   i18n.setText(element, 'status.connected', { count: data.count });
      // 它会同步当前词条和变量，之后 setLocale() 可正确重译当前状态。
      // 用户输入、网址、日志、计数结果等原始数据输出不要带 data-i18n，直接用 textContent。
      //
      // 跨源说明：面板(xload.net)与脚本(目标站点)跨源，BroadcastChannel 同源才互通；
      //   共用壳 panel.js 的 PanelChannel 已封装跨源通道（有 window.opener 走 postMessage，
      //   同源才走 BroadcastChannel），本页无需区分；油猴侧须配套 window.message 监听 +
      //   三级回包（panelWin → event.source → BroadcastChannel） + setPanelWin/getPanelWin。
      //   油猴侧 createChannel 直接用共享模板 templates/channel.js，勿自行重写。
      //
      // 示例（按需删除）：
      // channel.request('greet', { name: 'xload' }, 5000).then(function (data) {
      //   PUI.toast('收到回复：' + data.message, 'success');
      // }).catch(function (e) {
      //   PUI.toast('原页面未响应：' + e.message, 'warn');
      // });
    })();
  </script>
