      </div>
    </header>

      <div class="ad-slot ad-slot-top" aria-label="Advertisement" data-i18n-attr="aria-label:ad.label"></div>

      <div class="panel-content">
        <section class="pui-card" aria-label="Language" data-i18n-attr="aria-label:language.label">
          <label for="xload-language" data-i18n="language.label">Language</label>
          <select id="xload-language" class="pui-input">
            <option value="auto" data-i18n="language.auto">Auto</option>
            <option value="en" data-i18n="language.en">English</option>
            <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
            <option value="zh-TW" data-i18n="language.zhTW">繁體中文</option>
          </select>
        </section>
        <!-- ==================== 功能 UI：开发节点按脚本功能填写 ====================
             组件目录：/_preview/fab-panel-preview.html（仓库路径 _preview/fab-panel-preview.html）。
             样式统一 D0 极简黑白（静态）：黑 header、白卡、黑白按钮/开关/滑条，无动画/过渡。
             只能组合共享 panel.css 已定义的 pui-*/pb-* 组件；不得复制组件 CSS、另建主题，
             或重定义颜色、圆角、阴影、动效及基础控件外观。业务 class 仅补组件无法表达的布局。
             内联 <style> 仅黑白（#111/#fff/#d4d4d4/#e5e5e5/#ececec/#f4f4f4/#fafafa，
             次要文字 #555/#888/#a3a3a3），禁止任何彩色系（#2563eb 等）。
             把设置下发给油猴的主按钮文案一律用「保存配置」（toast「已保存配置」）。
        ==================== -->
        <section class="pui-card">
          <h2 class="pui-card-title" data-i18n="longText.enabled"></h2>
          <p id="connection" class="pb-status" role="status" data-i18n="status.working"></p>
          <label class="pb-sw"><span data-i18n="longText.enabled"></span><span class="pui-switch"><input id="enabled" type="checkbox" checked><i></i></span></label>
          <div class="pb-btns">
            <button id="save" type="button" class="pui-btn pui-btn-primary" data-i18n="control.save"></button>
            <button id="once" type="button" class="pui-btn pui-btn-default" data-i18n="longText.once"></button>
          </div>
          <p id="counts" class="pui-help" aria-live="polite"></p>
          <p class="pui-help" data-i18n="longText.help"></p>
          <p class="pui-help" data-i18n="longText.scope"></p>
        </section>
        <section class="pui-card">
          <h2 class="pui-card-title" data-i18n="logs.title"></h2>
          <div class="pb-btns">
            <button id="logs-show" type="button" class="pui-btn pui-btn-default" data-i18n="logs.show"></button>
            <button id="logs-copy" type="button" class="pui-btn pui-btn-default" data-i18n="logs.copy"></button>
          </div>
          <pre id="logs" class="pui-log" tabindex="0" data-i18n="logs.empty"></pre>
        </section>
      </div>
    </main>

    </footer>
  </div>
