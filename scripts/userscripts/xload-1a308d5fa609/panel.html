<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0DTNNMN4ZX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0DTNNMN4ZX');
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8681634724543084"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成器 - 功能面板</title>
  <meta name="description" content="将选中文本或输入的网址、文字一键生成二维码，支持尺寸与容错级别设置。">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/panel/panel.css">
</head>
<body data-panel-task="xload-1a308d5fa609">
  <div class="panel-layout">
    <header class="panel-header">
      <div class="panel-header-inner">
        <h1>二维码生成器</h1>
        <p class="panel-subtitle">将选中文本或输入的网址、文字一键生成二维码，支持尺寸与容错级别设置。</p>
      </div>
    </header>

    <main class="panel-main">
      <div class="panel-content">
        <div class="ad-slot ad-slot-top" aria-hidden="true"></div>

        <section class="panel-status" id="panel-status" data-state="waiting">
          <div class="panel-status-inner">
            <span class="panel-status-dot"></span>
            <span class="panel-status-text" id="panel-status-text">等待脚本连接…</span>
          </div>
          <div class="panel-progress" id="panel-progress" hidden>
            <div class="panel-progress-track"><div class="panel-progress-fill" id="panel-progress-fill"></div></div>
          </div>
        </section>



        <section class="pui-card panel-section" data-section="qr">
          <div class="pui-card-head">
            <div class="pui-card-title">生成二维码</div>

            <div class="pui-card-desc">输入内容，或留空使用页面选中文本（无选中时使用当前页面地址）。</div>

          </div>

          <div class="pui-form-grid">


            <div class="pui-field">
              <label class="pui-label" for="ctl-content">二维码内容</label>
              <input class="pui-input" id="ctl-content" data-control="content" data-type="text" type="text" value="">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-size">图片尺寸（像素）</label>
              <input class="pui-input" id="ctl-size" data-control="size" data-type="number" type="number" value="256">
            </div>



            <div class="pui-field">
              <label class="pui-label" for="ctl-error_level">容错级别</label>
              <select class="pui-input" id="ctl-error_level" data-control="error_level" data-type="select">

                <option value="L">L</option>

                <option value="M" selected>M</option>

                <option value="Q">Q</option>

                <option value="H">H</option>

              </select>
            </div>


          </div>


          <div class="panel-actions">

            <button class="pui-btn pui-btn-primary" type="button" data-action="generate">生成二维码</button>

          </div>

        </section>



        <div class="ad-slot ad-slot-bottom" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="panel-log" id="panel-log" hidden>
    <div class="panel-log-head">
      <span class="panel-log-title">运行日志</span>
      <div class="panel-log-tools">
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-clear">清空</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-copy">复制</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-download">下载</button>
        <button type="button" class="pui-btn pui-btn-default" id="panel-log-close">关闭</button>
      </div>
    </div>
    <div class="panel-log-list" id="panel-log-list"></div>
    <div class="panel-log-empty" id="panel-log-empty">暂无日志</div>
  </div>

  <script type="application/json" id="panel-loading">{"connecting":"等待脚本连接…","running":"正在生成…","done":"生成完成","failed":"生成失败"}</script>
  <script src="/assets/panel/panel.js"></script>
  <script>
    if (window.PanelPage) window.PanelPage.init();
  </script>
</body>
</html>
