# Exclude crawled third-party userscripts from secret scanning alerts.
# They routinely embed public identifiers such as WeChat Mini Program AppIDs
# (e.g. wxb1070eabc6f9107e in an anti-scraping Referer header), which are not
# credentials and cannot be rotated. Generated HTML/JSON stays scanned.
paths-ignore:
  - "scripts/userscripts/**/*.user.js"
